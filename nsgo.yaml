# vibe-time 的 nsgo 工具配置（go tool nsgo dev / build 使用；
# build 会临时生成资源 syso，产物在 dist/）。
name: vibe-time
id: limengwei.mindspace.vibetime
version: 2.1.2
copyright: © 2026 vibe-time
appearance: dark

# nsgo 只接受 PNG（内部经 image.Decode，不支持 .ico）。
icon:
  windows: assets/appicon.png
  png: assets/appicon.png

dev:
  target: native

build:
  output: dist
  targets: [windows_x64]
