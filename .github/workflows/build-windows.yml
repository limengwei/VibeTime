name: Build Windows Installer

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # NSIS 3.06+ compiles the setup.exe; without it the build leaves the .nsi alone
      - name: Install NSIS
        run: choco install nsis -y

      # Official nsgo build: reads nsgo.yaml (windows_x64 target), embeds
      # icon/version, and writes dist/releases/vibe-time-<version>-windows-x64-setup.exe
      - name: Build
        run: go tool nsgo build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-time-Windows-x64
          path: |
            dist/releases/vibe-time-*-windows-x64-setup.exe
            dist/releases/*.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/releases/vibe-time-*-windows-x64-setup.exe
            dist/releases/*.sha256
            dist/releases/install.ps1
            dist/releases/install.sh
          generate_release_notes: true
